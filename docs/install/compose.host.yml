# The Zima's /DATA/postroom/docker-compose.yml, as Shipyard manages it. Differences from the repo's
# development compose: literal `image: …:sha-<40hex>` lines — one per mapped service, spelled out in
# block style, because Shipyard rewrites exactly those lines at deploy time and ZimaOS's loader reads
# no .env — env from files, and no build: anywhere. Replace SHA with the commit being adopted.
name: postroom

services:
  wireguard:
    image: ghcr.io/matdemers1/d3-postroom/wireguard:sha-SHA
    cap_add: [NET_ADMIN]
    env_file: [/DATA/postroom/postroom.env]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/wg-health"]
      interval: 10s
      retries: 6
  smtp-in:
    image: ghcr.io/matdemers1/d3-postroom/server:sha-SHA
    command: ["smtp-in"]
    env_file: [/DATA/postroom/postroom.env]
    environment:
      HEALTH_PORT: "9101"
    network_mode: "service:wireguard"
    restart: unless-stopped
    volumes: [blobs:/var/lib/postroom/blobs]
    depends_on:
      postgres: { condition: service_healthy }
      wireguard: { condition: service_started }
  submission:
    image: ghcr.io/matdemers1/d3-postroom/server:sha-SHA
    command: ["submission"]
    env_file: [/DATA/postroom/postroom.env]
    environment:
      HEALTH_PORT: "9102"
    network_mode: "service:wireguard"
    restart: unless-stopped
    volumes: [blobs:/var/lib/postroom/blobs]
    depends_on:
      postgres: { condition: service_healthy }
      wireguard: { condition: service_started }
  imap:
    image: ghcr.io/matdemers1/d3-postroom/server:sha-SHA
    command: ["imap"]
    env_file: [/DATA/postroom/postroom.env]
    environment:
      HEALTH_PORT: "9103"
    network_mode: "service:wireguard"
    restart: unless-stopped
    volumes: [blobs:/var/lib/postroom/blobs]
    depends_on:
      postgres: { condition: service_healthy }
      wireguard: { condition: service_started }
  managesieve:
    image: ghcr.io/matdemers1/d3-postroom/server:sha-SHA
    command: ["managesieve"]
    env_file: [/DATA/postroom/postroom.env]
    environment:
      HEALTH_PORT: "9107"
    network_mode: "service:wireguard"
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      wireguard: { condition: service_started }
  delivery:
    image: ghcr.io/matdemers1/d3-postroom/server:sha-SHA
    command: ["delivery"]
    env_file: [/DATA/postroom/postroom.env]
    environment:
      HEALTH_PORT: "9104"
    network_mode: "service:wireguard"
    restart: unless-stopped
    volumes: [blobs:/var/lib/postroom/blobs]
    depends_on:
      postgres: { condition: service_healthy }
      wireguard: { condition: service_started }
  dav:
    image: ghcr.io/matdemers1/d3-postroom/server:sha-SHA
    command: ["dav"]
    env_file: [/DATA/postroom/postroom.env]
    environment:
      HEALTH_PORT: "9105"
    restart: unless-stopped
    volumes: [blobs:/var/lib/postroom/blobs]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    image: ghcr.io/matdemers1/d3-postroom/server:sha-SHA
    command: ["api"]
    env_file: [/DATA/postroom/postroom.env]
    environment:
      HEALTH_PORT: "3300"
      # Mail HTML renders only on this origin (PST-T-3.12): the tunnel routes usercontent.d3cloud.io
      # to this same api:3300, which answers it by Host. See docs/runbooks/usercontent.md.
      USERCONTENT_ORIGIN: https://usercontent.d3cloud.io
      # The admin Health screen's daemon tiles (PST-T-7.6, PST-REQ-127). smtp-in/submission/imap/
      # managesieve/delivery share the wireguard sidecar's network namespace, so their health ports are reached
      # at that hostname; dav and worker keep their own service names.
      DAEMON_HEALTH_URLS: "smtp-in=http://wireguard:9101/health,submission=http://wireguard:9102/health,imap=http://wireguard:9103/health,managesieve=http://wireguard:9107/health,delivery=http://wireguard:9104/health,dav=http://dav:9105/health,worker=http://worker:9106/health"
    restart: unless-stopped
    volumes: [blobs:/var/lib/postroom/blobs]
    depends_on:
      postgres: { condition: service_healthy }
  worker:
    image: ghcr.io/matdemers1/d3-postroom/server:sha-SHA
    command: ["worker"]
    env_file: [/DATA/postroom/postroom.env]
    environment:
      HEALTH_PORT: "9106"
    restart: unless-stopped
    volumes:
      - blobs:/var/lib/postroom/blobs
      - backups:/var/lib/postroom/backups
    depends_on:
      postgres: { condition: service_healthy }
  unbound:
    image: mvance/unbound:1.22.0
    volumes: [/DATA/postroom/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro]
    restart: unless-stopped
  postgres:
    image: postgres:16
    env_file: [/DATA/postroom/postgres.env]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postroom -d postroom"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  blobs:
  backups:
