packages:
  - apps/*
  - packages/*
  - workers/*

# Supply-chain policy, as in Foreman, Shipyard and D3 Auth: nothing published in the last seven
# days, no provenance downgrades, no exotic transitive sources.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
blockExoticSubdeps: true

# pnpm 10 runs no install scripts unless named here; each entry is a decision recorded when added.
onlyBuiltDependencies: []
