<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page draw under the notch and home indicator; mobile.css pads
         with env(safe-area-inset-*), which is 0 without it (PST-T-16.18). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The browser chrome follows the app: the D3 --color-bg of each theme (dark is the primary
         mode; light when the OS asks for it). A meta tag cannot read the page's CSS variables. -->
    <meta name="theme-color" content="#101117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f2f7" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Postroom</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
