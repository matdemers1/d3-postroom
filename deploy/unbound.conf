# Unbound configuration for Postroom's own DNSSEC-validating recursive resolver (PST-T-1.4,
# PST-REQ-064: the delivery daemon trusts the AD bit only from a resolver we run ourselves).
#
# Image: mvance/unbound:1.22.0. Its unbound.conf lives at
# /opt/unbound/etc/unbound/unbound.conf, and its root trust anchor at
# /opt/unbound/etc/unbound/var/root.key (auto-managed below via auto-trust-anchor-file).
#
# Compose wiring (done by the lead in docker-compose.yml, not this file): mount this file
# read-only at /opt/unbound/etc/unbound/unbound.conf in the `unbound` service, and give the
# protocol daemons DNS_RESOLVER="unbound:53" so packages/dns/src/resolver.ts's
# isTrustedResolverAddress() recognises it and trusts the AD bit. The `unbound` service should
# join the same private compose network as the daemons and publish no ports to the host.

server:
    # Listen on all interfaces inside the container's private network; access-control below is
    # what actually restricts who may query it, not the interface list.
    interface: 0.0.0.0
    interface: ::0
    port: 53

    # Only our own private network(s) may query this resolver. Anything else is refused, which
    # matters for an open resolver used in mail delivery (no open-relay-shaped DNS abuse vector).
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse

    # DNSSEC validation is the entire point of running this ourselves (PST-REQ-064): a bogus
    # answer becomes SERVFAIL, which packages/dns/src/errors.ts's DnsServfailError treats as
    # temporary/bogus, never as "no such record".
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/var/root.key"
    val-clean-additional: yes
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-algo-downgrade: yes

    # RFC 7816 qname minimisation: leak as little of the query name as possible to upstream
    # authoritative servers.
    qname-minimisation: yes
    aggressive-nsec: yes

    # Some authoritative servers still answer incorrectly to a DNS-0x20-style case-randomised
    # query id in EDNS; use-caps-for-id off avoids breaking those lookups.
    use-caps-for-id: no

    # harden-referral-path is expensive (extra lookups per referral) and mostly guards against a
    # spoofing scenario already covered by DNSSEC validation + our own access-control; left off.
    harden-referral-path: no

    # A small box: cache modestly rather than trying to hold the whole DNS.
    prefetch: yes
    prefetch-key: yes
    msg-cache-size: 32m
    rrset-cache-size: 64m
    cache-min-ttl: 0
    cache-max-ttl: 86400
    neg-cache-size: 4m

    # Don't advertise what we run.
    hide-identity: yes
    hide-version: yes

    # This host has no routed IPv6 at the time of writing; flip to yes once it does. Leaving
    # do-ip6 on with no route just adds latency (every lookup tries and times out on AAAA glue).
    do-ip6: no

    # Let the kernel load-balance across worker threads instead of a single shared socket.
    so-reuseport: yes
    num-threads: 2

    # EDNS0 payload size matches what packages/dns/src/wire.ts requests (1232, the DNS Flag Day
    # 2020 recommended safe default) so responses aren't needlessly truncated over UDP.
    edns-buffer-size: 1232

    # Answer TXT/SPF and other application records without extra roundtrips where cached.
    serve-expired: no
