# CI/e2e only: publish the api on loopback so Playwright on the runner can reach it, and give every
# daemon the same throwaway secrets. Never used on a host. D3 Auth points at a closed port on
# purpose: the e2e suite then proves the password path works with the issuer down (PST-REQ-005);
# the OIDC code flow itself is covered by apps/api's integration tests against e2e/fake-issuer.
x-e2e-secrets: &e2e-secrets
  PASSWORD_PEPPER: e2e-pepper-not-a-secret
  SESSION_SECRET: e2e-session-secret-not-a-secret
  POSTROOM_KEK: ${E2E_KEK:?set E2E_KEK to base64 of 32 bytes}

services:
  api:
    ports: ["127.0.0.1:3300:3300"]
    # So the image proxy in the container can reach the spec's listener on the runner.
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *e2e-secrets
      HEALTH_PORT: "3300"
      WEB_ORIGIN: http://127.0.0.1:3300
      # HTML mail renders on a separate origin (PST-T-3.12). Same published port, different host:
      # the api picks the usercontent app by Host, and localhost vs 127.0.0.1 is a different origin
      # AND a different site, so the session cookie for 127.0.0.1 is never sent to it.
      USERCONTENT_ORIGIN: http://localhost:3300
      # e2e/tests/html-render.spec.ts's listener stands in for a sender's server on the runner; the
      # image proxy may reach a private address only with POSTROOM_E2E_SEED=1 as well.
      IMAGE_PROXY_ALLOW_PRIVATE: "1"
      D3AUTH_ISSUER: http://127.0.0.1:1
      D3AUTH_CLIENT_ID: postroom
      D3AUTH_CLIENT_SECRET: e2e-client-secret
      # POST /api/admin/dev/seed (admin-only, audited) files synthetic mail for e2e/tests/mail.spec.ts.
      # Never set anywhere else: without it the route is not mounted at all.
      POSTROOM_E2E_SEED: "1"
      # The admin Health screen's daemon tiles (PST-T-7.6, PST-REQ-127). smtp-in/submission/imap/
      # delivery share the wireguard sidecar's network namespace (docker-compose.yml), so their
      # health ports are reached at that hostname; dav and worker keep their own.
      DAEMON_HEALTH_URLS: "smtp-in=http://wireguard:9101/health,submission=http://wireguard:9102/health,imap=http://wireguard:9103/health,managesieve=http://wireguard:9107/health,delivery=http://wireguard:9104/health,dav=http://dav:9105/health,worker=http://worker:9106/health"
  smtp-in: { environment: { <<: *e2e-secrets, HEALTH_PORT: "9101" } }
  submission: { environment: { <<: *e2e-secrets, HEALTH_PORT: "9102" } }
  imap: { environment: { <<: *e2e-secrets, HEALTH_PORT: "9103" } }
  managesieve: { environment: { <<: *e2e-secrets, HEALTH_PORT: "9107" } }
  delivery: { environment: { <<: *e2e-secrets, HEALTH_PORT: "9104" } }
  dav: { environment: { <<: *e2e-secrets, HEALTH_PORT: "9105" } }
  worker: { environment: { <<: *e2e-secrets, HEALTH_PORT: "9106" } }
