name: CI

# The ecosystem gate (PST-REQ-002): lint, unit, integration (PostgreSQL 16), e2e against the
# composed stack, and fuzz-smoke run side by side; images needs every one of them, so only a push to
# main that passed all of them publishes `sha-` images to GHCR. They ran as a chain until PST-T-0.18:
# that put 13 minutes in front of e2e, the longest stage, for no gain on a free public runner.
# GitHub-hosted runners only: this repo is public, and a self-hosted runner would execute any fork's
# pull request.
#
# Every action is pinned to a commit SHA, never a tag: a tag is a mutable pointer.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The private corpus is never committed (PST-REQ-108)
        run: |
          if git ls-files | grep -E '^(corpus/|fixtures/private/|fixtures/spamassassin/)'; then
            echo 'private or unlicensed mail is tracked in git' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @postroom/api openapi:check
      - run: pnpm check:corpus

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postroom
          POSTGRES_PASSWORD: postroom
          POSTGRES_DB: postroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postroom -d postroom"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postroom:postroom@127.0.0.1:5432/postroom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration drift check — schema.prisma and migrations/ must agree
        working-directory: packages/db
        env:
          SHADOW_DATABASE_URL: postgresql://postroom:postroom@127.0.0.1:5432/shadow
        run: |
          PGPASSWORD=postroom psql -h 127.0.0.1 -U postroom -d postroom -c 'CREATE DATABASE shadow;'
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
      - run: pnpm test:integration

  # Compose is what runs on the host, so the image is built the way it will be built there and the
  # e2e suite drives the stack rather than a dev server.
  #
  # Sharded, each shard on its own stack and fresh database: one worker spends most of its time
  # waiting out 30-second TOTP steps (the server burns every accepted step), and those waits divide
  # across shards. The specs already run in any order against a set-up stack — the mobile project
  # always has.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: No host ports anywhere in the base compose file
        run: |
          if docker compose -f docker-compose.yml config | grep -qE '^\s+(ports|published):'; then
            echo 'the base compose file publishes a port; ingress is WireGuard and the tunnel only' >&2
            exit 1
          fi
      - name: A throwaway KEK for this run
        run: echo "E2E_KEK=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Build the images
        run: |
          docker build -t ghcr.io/matdemers1/d3-postroom/server:local .
          docker compose build wireguard
      - name: Boot on an empty database, migrate, seed twice
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm migrate
          docker compose run --rm migrate seed
          docker compose run --rm migrate seed
          docker compose up -d --wait
          docker compose ps
      - name: Every daemon is its own container (PST-REQ-004)
        run: ./scripts/compose-smoke.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: hashFiles('e2e/package.json') != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: hashFiles('e2e/package.json') != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: e2e
        if: hashFiles('e2e/package.json') != ''
        env:
          POSTROOM_URL: http://127.0.0.1:3300
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @postroom/e2e exec playwright install --with-deps chromium
          pnpm --filter @postroom/e2e test --shard=${{ matrix.shard }}/8
      - name: Keep the report when e2e failed
        if: failure() && hashFiles('e2e/package.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7
      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  # Every parser's fuzz harness, briefly, with a fixed seed (PST-T-4.2 runs them for real nightly).
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm fuzz:smoke

  # The only job that publishes, and only from main once everything above is green. Tagged by long
  # SHA, labelled with the revision and schema Shipyard verifies before and after a swap.
  # The D3 App contract (PST-T-19.5): the conformance suite D3 Constellation's contract publishes,
  # run against this commit's api on a fresh database with a throwaway administrator — manifest,
  # native sign-in, me, refresh rotation and reuse, revoke, and (destructive, on that throwaway
  # account) throttling. Beside the gates rather than in front of `images`: it proves the native
  # contract, and a contract regression should fail the PR without holding back a fix elsewhere.
  #
  # The suite's image is private while matdemers1/d3-app-contract is (the owner's choice), and this
  # repository's own token cannot read another repository's package. D3_CONTRACT_TOKEN — a token
  # with read:packages — opens it; without that secret the job says so and does nothing, loudly,
  # rather than pretending to have run.
  conformance:
    name: conformance (d3-app-contract)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postroom
          POSTGRES_PASSWORD: postroom
          POSTGRES_DB: postroom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postroom -d postroom"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      D3_CONTRACT_TOKEN: ${{ secrets.D3_CONTRACT_TOKEN }}
      DATABASE_URL: postgresql://postroom:postroom@127.0.0.1:5432/postroom
    steps:
      - name: Without access to the suite, say so
        if: env.D3_CONTRACT_TOKEN == ''
        run: echo "::warning::D3_CONTRACT_TOKEN is not set, so the d3-app-contract suite cannot be pulled and did not run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.D3_CONTRACT_TOKEN != ''
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: env.D3_CONTRACT_TOKEN != ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: env.D3_CONTRACT_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.D3_CONTRACT_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: A test instance with a throwaway administrator
        if: env.D3_CONTRACT_TOKEN != ''
        working-directory: apps/api
        run: |
          CONFORMANCE_OUT="$RUNNER_TEMP/conformance.json" node --conditions=source --import tsx test/conformance-server.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do [ -s "$RUNNER_TEMP/conformance.json" ] && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/server.log"; exit 1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: env.D3_CONTRACT_TOKEN != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ env.D3_CONTRACT_TOKEN }}
      - name: The d3-app-contract suite
        if: env.D3_CONTRACT_TOKEN != ''
        run: |
          ARGS="$RUNNER_TEMP/conformance.json"
          docker run --rm --network host -v "$PWD:/out" ghcr.io/matdemers1/d3-app-conformance:contract-1 \
            --base "$(jq -r .base "$ARGS")" --allow-http --product postroom \
            --email "$(jq -r .email "$ARGS")" --password "$(jq -r .password "$ARGS")" \
            --totp-secret "$(jq -r .totpSecret "$ARGS")" --destructive --relay-listen 18555 --junit /out/conformance.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && env.D3_CONTRACT_TOKEN != ''
        with:
          name: conformance
          path: conformance.xml
          if-no-files-found: ignore

  images:
    needs: [lint, unit, integration, e2e, fuzz-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: server
            context: .
            file: Dockerfile
          - image: wireguard
            context: docker/wireguard
            file: docker/wireguard/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Schema and migration labels
        id: labels
        run: |
          schema=$(ls packages/db/prisma/migrations | grep -E '^[0-9]{14}_' | sort | tail -1)
          migration=$(git log -1 --format='%(trailers:key=Shipyard-Migration,valueonly)' | head -1 | tr -d '[:space:]')
          echo "schema=${schema}" >> "$GITHUB_OUTPUT"
          echo "migration=${migration:-none}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
          labels: |
            dev.d3cloud.shipyard.schema=${{ steps.labels.outputs.schema }}
            dev.d3cloud.shipyard.migration=${{ steps.labels.outputs.migration }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # The Zima host is x86_64.
          platforms: linux/amd64
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
