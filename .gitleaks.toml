# gitleaks config for Postroom (PST-T-13.1, PST-REQ-162).
#
# Extends gitleaks' own default rule set (https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml)
# rather than replacing it — Postroom writes its own crypto and credential code (KEK, DKIM, app
# passwords), so the generic AWS/PEM/token/JWT/high-entropy rules are exactly what should run here.
#
# The allowlist below is deliberately narrow: one entry per exact path, each naming what the match
# is and why it is synthetic. Nothing is allowlisted by a broad regex or a whole directory. A real
# secret anywhere else in the tree still fails the scan.
[extend]
useDefault = true

[allowlist]
  description = "Documented synthetic test material only — see PST-T-13.1"

  paths = [
    # AWS's own published example credentials (docs.aws.amazon.com/IAM), used verbatim as a
    # deterministic SigV4 test vector for the S3 backup uploader. Not a real key: this exact
    # accessKeyId/secretAccessKey pair is AWS's own long-standing documentation example.
    '''^apps/worker/test/unit/backup-sigv4\.test\.ts$''',

    # A literal PEM-shaped string used only as filler bytes to exercise the streaming AEAD
    # implementation's chunking at a realistic size. It is not parsed as a key anywhere and no
    # real key material follows the header text.
    '''^packages/crypto/test/unit/aead\.test\.ts$''',

    # A self-signed test-only TLS certificate (CN=test.d3cloud.io, generated for this fixture,
    # not used outside apps/worker's monitor test suite) — a public certificate, not a private
    # key, and not the production TLS material (which terminates at home and is never committed).
    '''^apps/worker/test/fixtures/cert\.crt$''',

    # Throwaway PGP and S/MIME test identities (example.test addresses) generated by
    # packages/pgp/test/fixtures/make-fixtures.sh, committed only so the decryption fixtures can be
    # opened in tests (PST-T-12.1). They protect nothing; regenerate them with the script.
    '''^packages/pgp/test/fixtures/alice-ed25519\.TEST-ONLY\.sec\.asc$''',
    '''^packages/pgp/test/fixtures/bob-rsa3072\.TEST-ONLY\.sec\.asc$''',
    '''^packages/pgp/test/fixtures/carol-smime\.TEST-ONLY\.key\.pem$''',

    # The Keys screen tells an import's kind from its armor header line (PST-T-12.2): the literal
    # "BEGIN PGP PRIVATE KEY BLOCK" is a string it searches for, not key material.
    '''^apps/web/src/keys/format\.ts$''',

    # The AUTH-redaction tables (PST-T-6.3): base64 of the made-up user "alice", password
    # "supersecret" and an XOAUTH2 blob, fed through the redactor to prove they never appear in a
    # stored transcript or the live feed. Synthetic on purpose; the two files are byte-identical.
    '''^apps/smtp-in/test/unit/transcript-redaction\.test\.ts$''',
    '''^apps/submission/test/unit/transcript-redaction\.test\.ts$''',

    # A published DMARC TXT record in the deliverability runbook: public DNS data, not a secret.
    '''^docs/runbooks/deliverability\.md$''',

    # DKIM signing tests pass keys generated at test time (generateKeyPairSync) by variable
    # reference — `privateKey: keys.ed25519.privateKey` — which the generic-api-key rule reads as
    # an assignment. No key material is in these files.
    '''^apps/delivery/test/integration/ses-worker\.test\.ts$''',
    '''^apps/delivery/test/unit/ses\.test\.ts$''',
    '''^packages/auth-checks/test/unit/dkim-verify\.test\.ts$''',
    '''^packages/auth-checks/test/unit/dkim-sign\.test\.ts$''',

    # A deliberately common password the e2e suite submits to prove the password policy refuses
    # it (ASVS 6.2.4). Weak by design; never a credential.
    '''^e2e/tests/account-security\.spec\.ts$''',

    # The common-passwords blocklist the password policy checks against (ASVS 6.2.4) — published
    # weak passwords, not secrets.
    '''^apps/api/src/auth/common-passwords\.ts$''',

    # The example environment file: every secret-looking key there is empty or a placeholder.
    '''^\.env\.example$''',
  ]
